# sysbuild.conf - sysbuild's OWN Kconfig namespace (SB_CONFIG_*), not the
# app's prj.conf.
#
# Espressif boards default to building MCUboot alongside the app whenever
# --sysbuild is used. This lab is a plain two-image AMP build (procpu +
# appcpu) with nothing to do with OTA, so MCUboot is unwanted - and per
# Lab 01, SB_CONFIG_BOOTLOADER is a Kconfig *choice*, so the alternative
# member must be explicitly selected with =y (setting MCUBOOT=n alone
# does not override a board's choice default).
SB_CONFIG_BOOTLOADER_NONE=y
SB_CONFIG_BOOTLOADER_MCUBOOT=n
