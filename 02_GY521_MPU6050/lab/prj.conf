# 02_GY521_MPU6050 - core0 (procpu) image

CONFIG_I2C=y
CONFIG_GPIO=y

CONFIG_SENSOR=y
CONFIG_MPU6050=y
# Polling mode only - this lab drives the sensor with plain
# sensor_sample_fetch() on a timer, not the interrupt pin. If your
# Zephyr checkout's mpu6050 driver requires a different trigger-mode
# Kconfig symbol name, `west build -t guiconfig` and search "MPU6050".
CONFIG_MPU6050_TRIGGER_NONE=y

# Inter-core mailbox to core1 (appcpu). Symbol confirmed in Lab 01
# against drivers/ipm/Kconfig upstream: it's ESP32_SOFT_IPM, not
# IPM_ESP32.
CONFIG_IPM=y
CONFIG_ESP32_SOFT_IPM=y

CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y

# sensor_value_to_double() and the accel/gyro unit conversions use
# floating point; ESP32-S3 has a hardware FPU.
CONFIG_FPU=y
