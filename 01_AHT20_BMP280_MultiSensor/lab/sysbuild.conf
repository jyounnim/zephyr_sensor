# sysbuild.conf - sysbuild's OWN Kconfig namespace (SB_CONFIG_*), not the
# app's prj.conf.
#
# Espressif boards default to building MCUboot alongside the app whenever
# --sysbuild is used (see Zephyr docs: boards/espressif/common/building-
# flashing.html - "By default, the ESP32 sysbuild creates bootloader
# (MCUboot) and application images."). This lab has nothing to do with
# OTA/firmware upgrades - it's a plain two-image AMP build (procpu +
# appcpu) - so MCUboot is unwanted overhead, and its configure step
# failing (missing signing key, mcuboot module not fully set up, etc.)
# will abort the whole sysbuild configure before our own images are even
# reached.
#
# IMPORTANT: SB_CONFIG_BOOTLOADER is a Kconfig *choice* (single-select),
# and Espressif's board-level Kconfig.sysbuild sets its default to
# BOOTLOADER_MCUBOOT. Setting `SB_CONFIG_BOOTLOADER_MCUBOOT=n` here is
# NOT enough to override a choice's default - you have to explicitly
# select the alternative member with =y instead. That's what actually
# turns MCUboot off; the MCUBOOT=n line is kept below only for clarity
# and is otherwise redundant once BOOTLOADER_NONE=y is set.
SB_CONFIG_BOOTLOADER_NONE=y
SB_CONFIG_BOOTLOADER_MCUBOOT=n
