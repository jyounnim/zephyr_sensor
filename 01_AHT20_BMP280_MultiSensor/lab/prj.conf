# 01_AHT20_BMP280_MultiSensor - core0 (procpu) image

CONFIG_I2C=y
CONFIG_GPIO=y

# Zephyr Sensor subsystem - AHT20 and BMP280 use in-tree drivers,
# selected from the devicetree compatible strings in the overlay.
# If your Zephyr checkout uses different Kconfig symbol names for
# either driver, `west build -t guiconfig` and search "DHT20" / "BME280".
CONFIG_SENSOR=y
CONFIG_DHT20=y
# Enables the AHT20/DHT20 driver's CRC-8 check on each 7-byte read.
# Without this, a corrupted I2C transfer silently produces plausible-
# looking-but-wrong temperature/humidity values instead of an error -
# confirmed against drivers/sensor/aosong/dht20/dht20.c upstream.
CONFIG_DHT20_CRC=y
CONFIG_BME280=y

# Inter-core mailbox to core1 (appcpu). Driver Kconfig symbol confirmed
# against drivers/ipm/Kconfig upstream: it's ESP32_SOFT_IPM, not
# IPM_ESP32 (that name doesn't exist and caused a Kconfig warning/abort
# on first build). Defaults to y automatically once the &ipm0
# devicetree node is enabled, but set explicitly here for clarity.
CONFIG_IPM=y
CONFIG_ESP32_SOFT_IPM=y

CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y

# sensor_value_to_double() uses double-precision math; ESP32-S3 has a
# hardware FPU.
CONFIG_FPU=y
