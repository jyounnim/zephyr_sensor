# Lab 04: ESP32-S3 Power Mode - core1 (appcpu) image
#
# Owns I2C1 (SSD1306 OLED) and the OLED's dedicated power-gate GPIO.
# Never touches I2C0 or the HW-664/LIS3DH - core0 forwards everything
# needed to render, and every mode transition, over IPM.

CONFIG_I2C=y
CONFIG_GPIO=y

CONFIG_IPM=y
CONFIG_ESP32_SOFT_IPM=y

CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y

# Used only for formatting float sensor values onto the OLED text lines.
CONFIG_FPU=y
