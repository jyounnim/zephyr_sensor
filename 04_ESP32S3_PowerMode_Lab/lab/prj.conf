# Lab 04: ESP32-S3 Power Mode - core0 (procpu) image
#
# Reads the HW-664 (actual chip: ST LIS3DH, confirmed via WHO_AM_I=0x33
# on real hardware - see the overlay header comment) over I2C0 and
# drives the 3-mode power state machine (Normal / Sleep / Ultra-Sleep).

CONFIG_I2C=y
CONFIG_GPIO=y

CONFIG_SENSOR=y
CONFIG_LIS2DH=y

# Inter-core mailbox to core1 (appcpu). Symbol confirmed in Lab 01
# against drivers/ipm/Kconfig upstream: it's ESP32_SOFT_IPM, not
# IPM_ESP32.
CONFIG_IPM=y
CONFIG_ESP32_SOFT_IPM=y

CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y

# Accel-to-g conversion and vector magnitude math use floating point;
# ESP32-S3 has a hardware FPU.
CONFIG_FPU=y

# System Power Management: deliberately OFF (confirmed on real
# hardware, 2026-09-14, after three separate failed attempts to make
# CONFIG_PM=y's automatic Light-Sleep coexist cleanly with this SoC PM
# driver + the LIS2DH sensor driver on this Zephyr snapshot
# (v4.4.0-13070-g6d1d551f6080) - see doc/04_ESP32S3_PowerMode_TROUBLESHOOTING_kr.md
# for the full history. Ultra-Sleep mode in this lab is a software-only
# low-power *policy* (slow polling + eventual reboot), not a confirmed
# hardware Light-Sleep demonstration.
CONFIG_PM=n

# Needed for sys_reboot(), used to leave Ultra-Sleep mode.
CONFIG_REBOOT=y
