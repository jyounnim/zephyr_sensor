# 03_HW664_LIS3DH - core0 (procpu) image
#
# CHIP IDENTITY CORRECTION (2026-09-04): confirmed via WHO_AM_I=0x33 on
# real hardware that this board is an ST LIS3DH, not a genuine LIS3DSH.
# Zephyr officially supports LIS3DH via the LIS2DH driver family
# (Kconfig symbol CONFIG_LIS2DH) - so this now uses the standard sensor
# subsystem instead of a hand-rolled raw-I2C driver. NOTE: despite the
# chip being LIS3DH, the devicetree compatible must be "st,lis2dh", not
# the documented-but-non-functional "st,lis3dh" - see the overlay's
# header comment and the troubleshooting doc for why.

CONFIG_I2C=y
CONFIG_GPIO=y

CONFIG_SENSOR=y
CONFIG_LIS2DH=y

# Inter-core mailbox to core1 (appcpu). Symbol confirmed in Lab 01
# against drivers/ipm/Kconfig upstream: it's ESP32_SOFT_IPM, not
# IPM_ESP32.
CONFIG_IPM=y
CONFIG_ESP32_SOFT_IPM=y

CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y

# Accel-to-g conversion and vector magnitude math use floating point;
# ESP32-S3 has a hardware FPU.
CONFIG_FPU=y
