sample:
  name: HW-664 (actually LIS3DH) dual-core (IPM, threshold+heartbeat) with SSD1306 on core1
  description: >
    core0 (procpu) reads the accelerometer's 3-axis acceleration every
    100 ms in one thread over I2C0, using Zephyr's standard sensor API
    (the board's WHO_AM_I confirmed this HW-664 module actually carries
    an ST LIS3DH, not the LIS3DSH its listing claims - Zephyr supports
    LIS3DH via the LIS2DH driver family). It pushes an IPM message to
    core1 immediately whenever the accel vector magnitude moves past a
    threshold since the last value actually sent (>=0.15g), plus a 1 s
    heartbeat so the link never looks stale while the board is still.
    core1 owns I2C1 and an SSD1306 128x64 OLED exclusively, displays all
    3 axes plus link health, redraws from an event-driven display
    thread woken by the IPM callback, and declares the link down after
    2 s without a message. Built with --sysbuild.
tests:
  sample.sensor.hw664_lis3dh_dualcore:
    build_only: true
    sysbuild: true
    platform_allow: esp32s3_devkitc/esp32s3/procpu
    tags: sensor display i2c threads ipm multicore
